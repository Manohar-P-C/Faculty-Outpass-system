<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Exit Monitoring System — SVIT</title>
  <meta name="description"
    content="SVIT Faculty Exit Outpass Monitoring System — digital outpass management for Sai Vidya Institute of Technology.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f4c81">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', sans-serif;
    }

    /* ── Full-screen video wrapper ── */
    #intro-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 100;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Gradient overlay on top of video ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.0) 40%,
          rgba(0, 0, 0, 0.0) 60%,
          rgba(0, 0, 0, 0.35) 100%);
      z-index: 101;
      pointer-events: none;
    }

    /* ── Skip button ── */
    #skip-btn {
      position: fixed;
      bottom: 36px;
      right: 36px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px;
      color: #fff;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.25s, transform 0.2s, border-color 0.25s;
      opacity: 0;
      animation: fadeInBtn 0.6s ease 1.2s forwards;
    }

    #skip-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.04);
    }

    #skip-btn svg {
      width: 14px;
      height: 14px;
      fill: #fff;
      flex-shrink: 0;
    }

    /* ── Sound toggle button ── */
    #sound-btn {
      position: fixed;
      top: 36px;
      right: 36px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px;
      color: #fff;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.25s, transform 0.2s, border-color 0.25s;
      opacity: 0;
      animation: fadeInBtn 0.6s ease 0.8s forwards;
    }

    #sound-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.04);
    }

    #sound-btn svg {
      width: 16px;
      height: 16px;
      fill: #fff;
      flex-shrink: 0;
    }

    /* ── Progress bar ── */
    #progress-bar-track {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 200;
    }

    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1e6bb8, #ff8c00);
      transition: width 0.1s linear;
      border-radius: 0 2px 2px 0;
    }

    /* ── Branding watermark (bottom-left) ── */
    #watermark {
      position: fixed;
      bottom: 28px;
      left: 32px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeInBtn 0.8s ease 1.5s forwards;
    }

    #watermark .dot {
      width: 8px;
      height: 8px;
      background: #ff8c00;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff8c00aa;
      animation: pulse 1.5s ease-in-out infinite;
    }

    #watermark span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    /* ── Fade-out transition ── */
    #intro-container.fade-out {
      animation: fadeOut 0.7s ease forwards;
    }

    /* ── Keyframes ── */
    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes fadeInBtn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.4);
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>

  <!-- ── Intro container ── -->
  <div id="intro-container">
    <video id="intro-video" src="{{ url_for('static', filename='videos/new svit.mp4') }}" autoplay playsinline
      preload="auto">
    </video>
  </div>

  <!-- ── Overlay ── -->
  <div id="overlay"></div>

  <!-- ── Sound toggle button ── -->
  <button id="sound-btn" onclick="toggleSound()">
    <svg id="sound-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path id="sound-icon-path" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <span id="sound-text">Audio On</span>
  </button>

  <!-- ── Progress bar ── -->
  <div id="progress-bar-track">
    <div id="progress-bar-fill"></div>
  </div>

  <!-- ── Watermark ── -->
  <div id="watermark">
    <div class="dot"></div>
    <span>Sai Vidya Institute of Technology</span>
  </div>

  <!-- ── Skip button ── -->
  <button id="skip-btn" onclick="skipIntro()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z" />
    </svg>
    Skip Intro
  </button>

  <script>
    const video = document.getElementById('intro-video');
    const container = document.getElementById('intro-container');
    const progressBar = document.getElementById('progress-bar-fill');
    const soundBtn = document.getElementById('sound-btn');
    const soundText = document.getElementById('sound-text');
    const soundIconPath = document.getElementById('sound-icon-path');
    let fallbackTimer;

    const SVG_UNMUTED = "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";
    const SVG_MUTED = "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z";

    function updateSoundUI() {
      if (video.muted) {
        soundText.textContent = "Unmute Sound";
        soundIconPath.setAttribute("d", SVG_MUTED);
      } else {
        soundText.textContent = "Audio On";
        soundIconPath.setAttribute("d", SVG_UNMUTED);
      }
    }

    function toggleSound() {
      video.muted = !video.muted;
      updateSoundUI();
      if (!video.muted && video.paused) {
        video.play();
      }
    }

    // Try starting unmuted audio playback
    video.muted = false;
    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.then(() => {
        updateSoundUI();
      }).catch(error => {
        // Autoplay policy prevented unmuted sound. Fallback to muted playback and prompt user to unmute.
        video.muted = true;
        updateSoundUI();
        video.play();
      });
    }

    // Unmute on first user interaction anywhere on the screen if muted by autoplay policy
    window.addEventListener('click', function enableAudioOnFirstClick() {
      if (video.muted) {
        video.muted = false;
        updateSoundUI();
      }
      window.removeEventListener('click', enableAudioOnFirstClick);
    }, { once: true });

    function getDuration() {
      return (video && video.duration && !isNaN(video.duration) && video.duration > 0) ? video.duration : 7;
    }

    /* ── Update progress bar ── */
    video.addEventListener('timeupdate', () => {
      const dur = getDuration();
      const pct = Math.min((video.currentTime / dur) * 100, 100);
      progressBar.style.width = pct + '%';
    });

    /* ── Redirect when video ends ── */
    video.addEventListener('ended', doRedirect);

    /* ── Set dynamic fallback redirect based on actual video duration ── */
    video.addEventListener('loadedmetadata', () => {
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(doRedirect, (video.duration + 0.5) * 1000);
    });

    /* Initial fallback safeguard */
    fallbackTimer = setTimeout(doRedirect, 7500);

    /* ── Skip button ── */
    function skipIntro() {
      clearTimeout(fallbackTimer);
      doRedirect();
    }

    /* ── Fade-out then redirect ── */
    let redirecting = false;
    function doRedirect() {
      if (redirecting) return;
      redirecting = true;
      clearTimeout(fallbackTimer);
      progressBar.style.width = '100%';
      container.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = "{{ url_for('home') }}?skip_intro=1";
      }, 700);
    }
  </script>
</body>

</html>
