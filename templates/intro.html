<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Exit Monitoring System — SVIT</title>
  <meta name="description" content="SVIT Faculty Exit Outpass Monitoring System — digital outpass management for Sai Vidya Institute of Technology.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f4c81">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', sans-serif;
    }

    /* ── Full-screen video wrapper ── */
    #intro-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 100;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Gradient overlay on top of video ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(0, 0, 0, 0.0)  40%,
        rgba(0, 0, 0, 0.0)  60%,
        rgba(0, 0, 0, 0.35) 100%
      );
      z-index: 101;
      pointer-events: none;
    }

    /* ── Skip button ── */
    #skip-btn {
      position: fixed;
      bottom: 36px;
      right: 36px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px;
      color: #fff;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.25s, transform 0.2s, border-color 0.25s;
      opacity: 0;
      animation: fadeInBtn 0.6s ease 1.2s forwards;
    }

    #skip-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.04);
    }

    #skip-btn svg {
      width: 14px;
      height: 14px;
      fill: #fff;
      flex-shrink: 0;
    }

    /* ── Progress bar ── */
    #progress-bar-track {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 200;
    }

    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1e6bb8, #ff8c00);
      transition: width 0.1s linear;
      border-radius: 0 2px 2px 0;
    }

    /* ── Branding watermark (bottom-left) ── */
    #watermark {
      position: fixed;
      bottom: 28px;
      left: 32px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeInBtn 0.8s ease 1.5s forwards;
    }

    #watermark .dot {
      width: 8px;
      height: 8px;
      background: #ff8c00;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff8c00aa;
      animation: pulse 1.5s ease-in-out infinite;
    }

    #watermark span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    /* ── Fade-out transition ── */
    #intro-container.fade-out {
      animation: fadeOut 0.7s ease forwards;
    }

    /* ── Keyframes ── */
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    @keyframes fadeInBtn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(1.4); opacity: 0.6; }
    }
  </style>
</head>
<body>

  <!-- ── Intro container ── -->
  <div id="intro-container">
    <video
      id="intro-video"
      src="{{ url_for('static', filename='videos/svit123.mp4') }}"
      autoplay
      muted
      playsinline
      preload="auto">
    </video>
  </div>

  <!-- ── Overlay ── -->
  <div id="overlay"></div>

  <!-- ── Progress bar ── -->
  <div id="progress-bar-track">
    <div id="progress-bar-fill"></div>
  </div>

  <!-- ── Watermark ── -->
  <div id="watermark">
    <div class="dot"></div>
    <span>Sai Vidya Institute of Technology</span>
  </div>

  <!-- ── Skip button ── -->
  <button id="skip-btn" onclick="skipIntro()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/>
    </svg>
    Skip Intro
  </button>

  <script>
    const video       = document.getElementById('intro-video');
    const container   = document.getElementById('intro-container');
    const progressBar = document.getElementById('progress-bar-fill');
    const DURATION    = 9; // seconds — matches your video length

    /* ── Update progress bar ── */
    video.addEventListener('timeupdate', () => {
      const pct = Math.min((video.currentTime / DURATION) * 100, 100);
      progressBar.style.width = pct + '%';
    });

    /* ── Redirect when video ends ── */
    video.addEventListener('ended', doRedirect);

    /* ── Fallback: redirect after DURATION + 0.5s buffer ── */
    const fallback = setTimeout(doRedirect, (DURATION + 0.5) * 1000);

    /* ── Skip button ── */
    function skipIntro() {
      clearTimeout(fallback);
      doRedirect();
    }

    /* ── Fade-out then redirect ── */
    let redirecting = false;
    function doRedirect() {
      if (redirecting) return;
      redirecting = true;
      clearTimeout(fallback);
      progressBar.style.width = '100%';
      container.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = "{{ url_for('home') }}?skip_intro=1";
      }, 700);
    }
  </script>
</body>
</html>
