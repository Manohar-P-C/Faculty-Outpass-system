<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

<body

        height:100vh;

========================================================= -->

        min-height:620px;
        overflow:hidden;

        display:flex;

========================================================= -->

========================================================= -->

========================================================= -->

        right:-230px;

<!-- =========================================================

========================================================= -->

    id="blueLight"
    style="
        position:absolute;

        width:520px;
        height:520px;

        left:-220px;
        top:25%;

        border-radius:50%;

        background:
            rgba(55,90,210,.22);

<!-- =========================================================
     CENTRAL ARCHITECTURAL CIRCLE
========================================================= -->

<div
    id="emblem"

    style="
        position:absolute;

        left:50%;
        top:50%;

        width:min(760px,72vw);

        aspect-ratio:1;

        transform:

        border:

        pointer-events:none;

        will-change:transform;

    <div

            inset:8%;

    <div

            inset:32%;

            border:
                1px solid
                rgba(255,255,255,.055);

</div>


<!-- =========================================================
     ORBITAL RINGS
========================================================= -->

<div
    id="orbit1"
    style="
        position:absolute;

        left:50%;
        top:50%;

        width:620px;
        height:260px;

<!-- =========================================================
     INLINE JAVASCRIPT
========================================================= -->

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const hero =
    document.getElementById("hero");

const emblem =
    document.getElementById("emblem");

const orbit1 =
    document.getElementById("orbit1");

const orbit2 =
    document.getElementById("orbit2");

const content =
    document.getElementById("content");

const title =
    document.getElementById("mainTitle");

const system =
    document.getElementById("systemText");

const buttonWrapper =
    document.getElementById("buttonWrapper");

const button =
    document.getElementById("enterButton");

const buttonSweep =
    document.getElementById("buttonSweep");

const columnLeft =
    document.getElementById("columnLeft");

const columnRight =
    document.getElementById("columnRight");

const goldLight =
    document.getElementById("goldLight");

const blueLight =
    document.getElementById("blueLight");

const particles = [

    document.getElementById("particle1"),

    document.getElementById("particle2"),

    document.getElementById("particle3"),

    document.getElementById("particle4"),

    document.getElementById("particle5")

];


/* =========================================================
   CINEMATIC INTRO
========================================================= */

window.addEventListener(
    "load",
    () => {

        /* Columns */

        setTimeout(() => {

            if (columnLeft && columnRight) {
                columnLeft.style.opacity = ".31";
                columnRight.style.opacity = ".31";

                columnLeft.style.transform =
                    "translateY(0)";

                columnRight.style.transform =
                    "translateY(0)";
            }

        },150);


        /* Title */

        setTimeout(() => {

            title.style.opacity = "1";

            title.style.transform =
                "translateY(0) scale(1)";

            title.style.filter =
                "blur(0)";

            title.style.transition =
                "all 1.45s cubic-bezier(.16,1,.3,1)";

        },1150);


        /* SYSTEM */

        setTimeout(() => {

            system.style.opacity = "1";

            system.style.transform =
                "translateY(0)";

            system.style.filter =
                "blur(0)";

            system.style.letterSpacing =
                ".025em";

            system.style.transition =
                "all 1.3s cubic-bezier(.16,1,.3,1)";

        },1700);


        /* Button */

        setTimeout(() => {

            buttonWrapper.style.opacity = "1";

            buttonWrapper.style.transform =
                "translateY(0) scale(1)";

            buttonWrapper.style.filter =
                "blur(0)";

            buttonWrapper.style.transition =
                "all 1.15s cubic-bezier(.16,1,.3,1)";

        },2250);

    }
);


/* =========================================================
   MOUSE TRACKING
========================================================= */

let mouseX = 0;
let mouseY = 0;

let smoothX = 0;
let smoothY = 0;

hero.addEventListener(
    "mousemove",
    (event) => {

        mouseX =
            event.clientX /
            window.innerWidth -
            .5;

        mouseY =
            event.clientY /
            window.innerHeight -
            .5;


        goldLight.style.left =
            `${event.clientX - 325}px`;

        goldLight.style.top =
            `${event.clientY - 325}px`;

        goldLight.style.right = "auto";

    }
);


/* =========================================================
   SMOOTH DEPTH ENGINE
========================================================= */

function animateScene(){

    smoothX +=
        (mouseX - smoothX) * .045;

    smoothY +=
        (mouseY - smoothY) * .045;


    /* Central circle */

    emblem.style.transform =

        `translate(
            calc(-50% + ${smoothX * 24}px),
            calc(-50% + ${smoothY * 24}px)
        )
        rotate(${smoothX * 2}deg)`;


    /* Orbit 1 */

    orbit1.style.transform =

        `translate(
            calc(-50% + ${smoothX * 15}px),
            calc(-50% + ${smoothY * 10}px)
        )
        rotate(${smoothX * 8 - 15}deg)`;


    /* Orbit 2 */

    orbit2.style.transform =

        `translate(
            calc(-50% + ${smoothX * -12}px),
            calc(-50% + ${smoothY * -8}px)
        )
        rotate(${smoothX * -5 + 18}deg)`;


    /* Main composition */

    content.style.transform =

        `translate(
            ${smoothX * 7}px,
            ${28 + smoothY * 5}px
        )`;


    /* Columns */

    if (columnLeft && columnRight) {
        columnLeft.style.transform =

            `translate(
                ${smoothX * -12}px,
                ${smoothY * 5}px
            )`;


        columnRight.style.transform =

            `translate(
                ${smoothX * 12}px,
                ${smoothY * 5}px
            )`;
    }


    /* Blue atmosphere */

    blueLight.style.transform =

        `translate(
            ${smoothX * -35}px,
            ${smoothY * -20}px
        )`;


    /* Particles */

    particles.forEach(
        (particle,index) => {

            if (!particle) return;
            const depth =
                5 + index * 2;

            particle.style.transform =

                `translate(
                    ${smoothX * depth}px,
                    ${smoothY * depth}px
                )`;

        }
    );


    requestAnimationFrame(
        animateScene
    );

}

animateScene();


/* =========================================================
   MAGNETIC BUTTON
========================================================= */

button.addEventListener(
    "mousemove",
    (event) => {

        const rect =
            button.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left -
            rect.width / 2;

        const y =
            event.clientY -
            rect.top -
            rect.height / 2;


        button.style.transform =

            `translate(
                ${x * .12}px,
                ${y * .18}px
            )
            scale(1.025)`;

        button.style.boxShadow =

            `0 24px 55px
             rgba(30,15,5,.35),
             0 0 70px
             rgba(240,201,87,.5)`;

    }
);


button.addEventListener(
    "mouseleave",
    () => {

        button.style.transform =
            "translate(0,0) scale(1)";

        button.style.boxShadow =

            `0 15px 30px
             rgba(30,15,5,.25),
             0 0 30px
             rgba(240,201,87,.25)`;

    }
);


/* =========================================================
   BUTTON LIGHT SWEEP
========================================================= */

let sweepPosition =
    -120;


function sweep(){

    sweepPosition += .8;

    if(
        sweepPosition > 160
    ){

        sweepPosition = -120;

    }


    buttonSweep.style.left =
        sweepPosition + "%";


    requestAnimationFrame(
        sweep
    );

}

setTimeout(
    sweep,
    3500
);


/* =========================================================
   SOFT FLOATING PARTICLES
========================================================= */

particles.forEach(
    (particle,index) => {

        if (!particle) return;
        let phase =
            index * 1.7;


        function particleMotion(time){

            const y =
                Math.sin(
                    time * .0015 +
                    phase
                ) * 18;


            const x =
                Math.cos(
                    time * .0011 +
                    phase
                ) * 12;


            particle.style.marginTop =
                y + "px";

            particle.style.marginLeft =
                x + "px";


            requestAnimationFrame(
                particleMotion
            );

        }


        requestAnimationFrame(
            particleMotion
        );

    }
);


/* =========================================================
   CONTINUOUS ARCHITECTURAL LIGHT
========================================================= */

let lightPhase = 0;

function architecturalLight(){

    lightPhase += .008;


    const scale =
        1 +
        Math.sin(lightPhase) * .08;


    goldLight.style.transform =
        `scale(${scale})`;


    requestAnimationFrame(
        architecturalLight
    );

}

architecturalLight();


/* =========================================================
   ENTER TRANSITION TO LOGIN PORTAL
========================================================= */

button.addEventListener(
    "click",
    (event) => {

        event.preventDefault();

        // Smooth cinematic exit transition
        content.style.transition = "all 0.55s cubic-bezier(.16,1,.3,1)";
        content.style.opacity = "0";
        content.style.transform = "translateY(-30px) scale(0.96)";

        hero.style.transition = "opacity 0.6s ease";
        hero.style.opacity = "0";

        setTimeout(() => {
            window.location.href = "{{ url_for('main_portal') }}";
        }, 500);

    }
);

</script>
