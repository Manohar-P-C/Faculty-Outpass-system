<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faculty Email Verification – SVIT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Verify your faculty email to reset your password for the SVIT Faculty Exit Outpass System.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f4c81">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f4c81,#1e6bb8,#ff8c00);
    background-size:300% 300%;
    animation:gradientMove 10s ease infinite;
    font-family:'Segoe UI',Arial,sans-serif;
    padding:20px;
}
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:40px 35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}
h2{
    color:#1e3a5f;
    margin-bottom:8px;
    font-size:22px;
}
p{
    color:#666;
    font-size:13px;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:13px 16px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:14px;
    outline:none;
    transition:border-color 0.2s;
    box-sizing:border-box;
}
input:focus{border-color:#1e6bb8;box-shadow:0 0 0 3px rgba(30,107,184,0.15);}
button{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#1e6bb8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    min-height:44px;
}
button:hover{background:#155a99;transform:translateY(-1px);}
a{
    display:block;
    margin-top:15px;
    color:#1e6bb8;
    text-decoration:none;
    font-size:13px;
}
a:hover{text-decoration:underline;}
.error{color:#e74c3c;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div class="card">
    <h2>👨‍🏫 Faculty Email Verification</h2>
    <p>Enter your faculty email to receive an OTP.</p>
    <form method="POST">
        <input type="email" name="email" placeholder="Enter Faculty Email" required>
        <button type="submit">Send OTP</button>
    </form>
    <a href="/faculty_login">← Back to Login</a>
    {% if error %}
    <p class="error">{{error}}</p>
    {% endif %}
</div>
</body>
</html>
