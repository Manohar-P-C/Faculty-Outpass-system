<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Security Forgot Password – SVIT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2e9e58">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f4c81,#1e6bb8,#ff8c00);
    background-size:300% 300%;
    animation:gradientMove 10s ease infinite;
    font-family:'Segoe UI',Arial,sans-serif;
    padding:20px;
}
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
.card{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(10px);
    padding:40px 35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
}
h2{color:#333;margin-bottom:20px;font-size:22px;}
input{
    width:100%;
    padding:13px 16px;
    margin:8px 0;
    border-radius:25px;
    border:none;
    background:#f1f1f1;
    font-size:14px;
    outline:none;
    box-sizing:border-box;
}
input:focus{box-shadow:0 0 0 3px rgba(46,158,88,0.2);}
button{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#2e9e58,#1c6838);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    min-height:44px;
}
button:hover{transform:scale(1.03);}
.back{
    display:block;
    margin-top:15px;
    color:#333;
    text-decoration:none;
    font-size:13px;
}
.back:hover{text-decoration:underline;}
.error{color:#e74c3c;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div class="card">
    <h2>🔒 Forgot Password</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Enter Email" required>
        <button type="submit">Send OTP</button>
    </form>
    <a href="/security_login" class="back">← Back to Login</a>
    {% if error %}
    <p class="error">{{error}}</p>
    {% endif %}
</div>
</body>
</html>
