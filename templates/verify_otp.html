<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify OTP – SVIT Faculty Exit System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f4c81">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f4c81,#1e6bb8,#ff8c00);
    background-size:300% 300%;
    animation:gradientMove 10s ease infinite;
    font-family:'Segoe UI',Arial,sans-serif;
    padding:20px;
}
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:40px 35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}
h2{color:#1e3a5f;margin-bottom:8px;font-size:22px;}
p{color:#666;font-size:13px;margin-bottom:18px;}
input{
    width:100%;
    padding:13px 16px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:14px;
    outline:none;
    transition:border-color 0.2s;
    box-sizing:border-box;
}
input:focus{border-color:#1e6bb8;box-shadow:0 0 0 3px rgba(30,107,184,0.15);}
.password-wrapper{
    position:relative;
    width:100%;
}
.password-wrapper input{padding-right:44px;}
.toggle-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:#666;
    background:none;
    border:none;
    padding:0;
    line-height:1;
    user-select:none;
}
.toggle-password:hover{color:#333;}
button{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#1e6bb8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    min-height:44px;
}
button:hover{background:#155a99;transform:translateY(-1px);}
.error{color:#e74c3c;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div class="card">
    <h2>🔐 Verify OTP</h2>
    <p>OTP sent to <b>{{ email }}</b></p>
    <form method="POST">
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <div class="password-wrapper">
            <input type="password" id="passwordField" name="new_password" placeholder="Enter New Password" required>
            <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>
        <button type="submit">Reset Password</button>
    </form>
    {% if error %}
    <p class="error">{{error}}</p>
    {% endif %}
</div>
<script>
function togglePassword(){
    var f=document.getElementById('passwordField');
    var t=document.querySelector('.toggle-password');
    if(f.type==='password'){f.type='text';t.textContent='🙈';}
    else{f.type='password';t.textContent='👁️';}
}
</script>
</body>
</html>
